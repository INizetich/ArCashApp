<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/login-register.css}">
    <link rel="stylesheet" th:href="@{css/color-palet.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
    <title>Registro</title>
</head>
<body>

<div class="theme-control">
    <button id="theme-switcher">
        <svg width="22" height="22" viewBox="0 0 24 24">
            <path class="sun" d="M12 6a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/>
            <path class="sun-ray" d="M12 2v2m0 16v2M4 12H2m20 0h-2m3-7l-2 2m-13 13l-2 2m17-15l2 2M3 19l2 2"/>
        </svg>
    </button>
</div>
<div>
    <button id="back-button" onclick="window.history.back()" aria-label="Volver">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" class="back-circle"/>
            <path d="M14 8L10 12L14 16" class="back-arrow" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>
</div>
    <div class="main">
        <div class="left-panel">
            <div class="logo">
                <img src="/img/logo.svg" alt="Logo ArCash" class="logo">
                <h1>AR<span>Cash</span></h1>
                <h4>VIRTUAL WALLET</h4>
            </div>
        </div>

        <div class="right-panel">
            <div class="formulario">
                <h2>Registrarse</h2>
                <form id="Register" method="post" th:action="@{/create}">
                    <div class="input-container">
                        <label>Nombre</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="text" name="nombre" title="ingrese un nombre valido" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,}">
                            <span class="focus-border"></span>
                        </div>
                    </div>

                    <div class="input-container">
                        <label>Apellido</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="text" name="apellido" title="ingrese un apellido valido" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,}">
                            <span class="focus-border"></span>
                        </div>
                    </div>

                    <div class="input-container">
                        <label>D.N.I</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="text" name="dni" required maxlength="8" pattern="\d{8}">
                            <span class="focus-border"></span>
                        </div>
                    </div>

                    <div class="input-container">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="email" name="email" required title="Ingrese un Email Valido">
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="input-container">
                        <label>Contraseña</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="password" name="password" id="password" required minlength="6" title="Debe tener al menos 6 caracteres">
                            <span class="focus-border"></span>
                        </div>
                    </div>

                    <div class="input-container">
                        <label>Confirmar Contraseña</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="password" name="confirmPassword" id="confirmPassword" required>
                            <span class="focus-border"></span>
                        </div>
                    </div>

                    <small id="passwordHelp">Las contraseñas no coinciden</small>


                    <div class="input-container">
                        <label>Nombre de usuario</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="text" name="alias" required maxlength="10">
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <button type="submit">Enviar</button>

                    <pre id="respuesta"></pre>
                </form>
            </div>
        </div>

        <div class="global-footer">
            <p>ArCash™ | Virtual Wallet <a href="https://mail.google.com/mail/?view=cm&fs=1&to=helparcash2025@gmail.com" target="_blank" class="email-link">helparcash2025@gmail.com</a></p>
        </div>

    </div>
    <script th:src="@{/js/registro.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
<div id="toast-container"></div>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
