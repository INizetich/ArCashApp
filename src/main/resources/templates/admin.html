<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administradores de ArCash</title>
    <link rel="stylesheet" th:href="@{/css/login-register.css}">
    <link rel="stylesheet" th:href="@{/css/color-palet.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="theme-control">
    <button id="theme-switcher">
        <svg width="22" height="22" viewBox="0 0 24 24">
            <path class="sun" d="M12 6a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/>
            <path class="sun-ray" d="M12 2v2m0 16v2M4 12H2m20 0h-2m3-7l-2 2m-13 13l-2 2m17-15l2 2M3 19l2 2"/>
        </svg>
    </button>
</div>
<div>
    <button id="back-button" onclick="window.history.back()" aria-label="Volver">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" class="back-circle"/>
            <path d="M14 8L10 12L14 16" class="back-arrow" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>
</div>
<div class="main">
    <div class="left-panel">
        <div class="logo">
            <svg class="brand-mark" width="140" height="140" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <path d="M60 20 L100 40 V80 L60 100 L20 80 V40 Z" fill="none" stroke="#2A4D7A" stroke-width="4"/>
                <circle cx="60" cy="60" r="18" fill="none" stroke="#2A4D7A" stroke-width="4"/>
                <path d="M60 42 L60 78 M48 60 L72 60" stroke="#2A4D7A" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <h1>AR<span>Cash</span></h1>
            <h4>VIRTUAL WALLET</h4>
        </div>
    </div>
    <div class="right-panel">
        <div class="formulario">
            <h2>Panel de Administración</h2>
            <button id="ver-usuarios" class="access-btn primary">Ver usuarios autenticados</button>
            <button id="mostrar-form-admin" class="access-btn secondary">Crear nuevo administrador</button>
            <div id="usuarios-lista" style="margin-top:20px;"></div>
            <div id="form-admin" style="display:none; margin-top:20px;">
                <form id="crear-admin-form" class="formulario formulario-compacto">
                    <div class="input-container">
                        <label>Nombre</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="text" name="nombre" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,}">
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="input-container">
                        <label>Apellido</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="text" name="apellido" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,}">
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="input-container">
                        <label>D.N.I</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="text" name="dni" required maxlength="8" pattern="\d{8}">
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="input-container">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="email" name="email" required>
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="input-container">
                        <label>Contraseña</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="password" name="password" id="admin-password" required minlength="6">
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="input-container">
                        <label>Confirmar Contraseña</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="password" name="confirmPassword" id="admin-confirmPassword" required>
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <small id="admin-passwordHelp">Las contraseñas no coinciden</small>
                    <div class="input-container">
                        <label>Nombre de usuario</label>
                        <div class="input-wrapper">
                            <input class="effect-1" type="text" name="alias" required maxlength="10">
                            <span class="focus-border"></span>
                        </div>
                    </div>
                    <button type="submit">Crear Administrador</button>
                    <pre id="admin-respuesta"></pre>
                </form>
                <button type="button" id="cancelar-form-admin" class="access-btn secondary" style="margin-top: 1rem;">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
</div>

<div id="usuario-modal" class="modal hidden">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h3>Información del Usuario</h3>
        <div id="usuario-info"></div>
    </div>
</div>
<div class="global-footer">
    <p>ArCash™ | Virtual Wallet <a href="https://mail.google.com/mail/?view=cm&fs=1&to=helparcash2025@gmail.com" target="_blank" class="email-link">helparcash2025@gmail.com</a></p>
</div>
<div id="toast-container" style="position:fixed;top:30px;right:30px;z-index:9999;"></div>
<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
