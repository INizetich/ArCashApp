<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link rel="icon" th:href="@{/img/logo.svg}" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | ArCash™</title>
    <link rel="stylesheet" th:href="@{/css/login-register.css}">
    <link rel="stylesheet" th:href="@{/css/color-palet.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
</head>
<body>
<div class="theme-control">
    <button id="theme-switcher">
        <svg width="22" height="22" viewBox="0 0 24 24">
            <path class="sun" d="M12 6a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/>
            <path class="sun-ray" d="M12 2v2m0 16v2M4 12H2m20 0h-2m3-7l-2 2m-13 13l-2 2m17-15l2 2M3 19l2 2"/>
        </svg>
    </button>
</div>

<main class="main-container">
    <div class="logo">
        <img src="/img/logo.svg" alt="Logo ArCash">
        <h1>AR<span>Cash</span></h1>
        <h4>VIRTUAL WALLET</h4>
    </div>
    <div class="logo logo-space">

    </div>

    <div class="access-interface">
        <div class="formulario">
            <h2>Restablecer contraseña</h2>
            <form th:action="@{/reset-password}" method="post" id="resetForm" autocomplete="off">
                <div th:if="${error}" class="error" th:text="${error}"></div>
                <input type="hidden" name="token" th:value="${token}" />
                <div class="input-container">
                    <label for="password">Nueva contraseña</label>
                    <div class="input-wrapper">
                        <input class="effect-1" type="password" id="password" name="password" required minlength="6" autocomplete="new-password" />
                        <span class="focus-border"></span>
                    </div>
                </div>
                <div class="input-container">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="input-wrapper">
                        <input class="effect-1" type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password" />
                        <span class="focus-border"></span>
                    </div>
                </div>
                <button type="submit" id="submitBtn" disabled>Cambiar</button>
            </form>
        </div>
    </div>

    <div class="global-footer">
        <p>ArCash™ | Virtual Wallet <a href="https://mail.google.com/mail/?view=cm&fs=1&to=helparcash2025@gmail.com" target="_blank" class="email-link">helparcash2025@gmail.com</a></p>
    </div>
</main>

<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<script>
    // Validación y feedback visual
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    let lastToast = '';

    function validatePasswords() {
        const pass = password.value.trim();
        const conf = confirm.value.trim();

        // Desactiva si alguna está vacía o no cumple longitud
        if (!pass || !conf || pass.length < 6 || conf.length < 6) {
            submitBtn.disabled = true;
            return false;
        }

        // Desactiva si no coinciden
        if (pass !== conf) {
            submitBtn.disabled = true;
            return false;
        }

        // Habilita si todo está bien
        submitBtn.disabled = false;
        return true;
    }

    function showPasswordToast() {
        const pass = password.value.trim();
        const conf = confirm.value.trim();

        if (!pass || !conf || pass.length < 6 || conf.length < 6) {
            lastToast = '';
            return;
        }

        if (pass !== conf && lastToast !== 'no-coinciden') {
            showToast('Las contraseñas no coinciden.', 'FAILED');
            lastToast = 'no-coinciden';
        } else if (pass === conf && lastToast !== 'coinciden') {
            showToast('¡Las contraseñas coinciden!', 'SUCCESS');
            lastToast = 'coinciden';
        }
    }

    password.addEventListener('input', () => {
        validatePasswords();
        showPasswordToast();
    });

    confirm.addEventListener('input', () => {
        validatePasswords();
        showPasswordToast();
    });

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        if (password.value !== confirm.value) {
            showToast('Las contraseñas no coinciden.', 'FAILED');
            return false;
        }
        if (!password.value || !confirm.value) {
            showToast('Completa ambos campos.', 'FAILED');
            return false;
        }

        // Envía el formulario por fetch
        const formData = new FormData(this);
        const response = await fetch(this.action, {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            showToast('Contraseña modificada exitosamente', 'SUCCESS');
            setTimeout(() => {
                window.location.href = '/home';
            }, 2000);
        } else {
            showToast('Error al modificar la contraseña.', 'FAILED');
        }
    });
</script>
<div id="toast-container"></div>
</body>
</html>
